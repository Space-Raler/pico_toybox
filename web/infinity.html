<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>Infinity Base</title>
<style>
:root{--bg:#0e1015;--panel:#151821;--body:#171a22;--rim:#2b3040;--empty:#1c202b;--text:#e8ecf3;--muted:#8a93a6;--good:#3be8a0;--warn:#f2c14e;--bad:#ff5a4d;--p1:#3aa0ff;--p2:#ff6a4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px)}
header{display:flex;gap:8px;align-items:center;padding:10px 0;position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1 1 auto}
button,.btn{background:var(--rim);color:var(--text);border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer;min-height:42px}
button:active,.btn:active{filter:brightness(1.3)}
button.primary{background:#2a6df4}
button.danger{background:#5a2a2e}
button.on{background:#2a6df4}
button:disabled{opacity:.4}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.status{background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);display:grid;gap:2px}
.status b{font-weight:600}
.g{color:var(--good)}.w{color:var(--warn)}.r{color:var(--bad)}
#msg{min-height:20px;margin:8px 2px;font-size:13px}
.portal{background:var(--body);border:2px solid var(--rim);border-radius:22px;padding:6px;margin:8px 0}
svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none}
.slot{cursor:pointer}
.slot .ring{fill:var(--empty);stroke:var(--rim);stroke-width:5}
.slot.target .ring{stroke:#fff;stroke-width:7;stroke-dasharray:14 10}
.sl{fill:var(--muted);font-size:21px;text-anchor:middle;pointer-events:none}
.nm{fill:#fff;font-size:22px;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#000;stroke-width:5px}
.ini{fill:#fff;font-size:44px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pl{font-size:26px;font-weight:700;text-anchor:middle;letter-spacing:3px}
section{background:var(--panel);border-radius:14px;padding:10px;margin:10px 0}
section h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
input[type=search],select{width:100%;background:var(--empty);border:1px solid var(--rim);color:var(--text);border-radius:10px;padding:10px;font:inherit;min-height:42px}
.list{display:grid;gap:6px;margin-top:8px;max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:var(--empty);border-radius:10px;padding:6px 8px;border:2px solid transparent;cursor:pointer}
.row.sel{border-color:#2a6df4}
.row.onp{opacity:.55}
.thumb{width:44px;height:44px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;font-weight:700;color:#fff;background-size:cover;background-position:center top}
.row .t{flex:1;min-width:0}.row .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted)}
.row .more{background:transparent;padding:6px 10px;min-height:36px;color:var(--muted)}
#log{font:11px/1.4 ui-monospace,monospace;color:var(--muted);max-height:160px;overflow:auto;white-space:pre-wrap}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
input[type=file]{display:none}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--rim);border-radius:16px;max-width:92vw;width:420px}
dialog::backdrop{background:#000a}
dialog button{display:block;width:100%;margin:6px 0;text-align:left}
</style>
</head>
<body>
<header>
  <h1>Infinity Base</h1>
  <button id="bConnect" class="primary">Connect</button>
  <button id="bDemo">Demo</button>
</header>
<div class="status" id="status"></div>
<div id="msg"></div>
<div class="portal"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div class="bar">
  <button id="bPlaceSel">Place selected</button>
  <button id="bPlaceAll">Place all</button>
  <button id="bClear" class="danger">Clear base</button>
</div>
<p class="hint">Tap a figure below to select it, then tap a slot. Tap a figure on the base to lift it off. Double-tap a list item to put it on the next free slot.</p>
<section>
  <h2>Figures</h2>
  <div class="bar">
    <label class="btn" for="fFiles">Add figures…</label>
    <label class="btn" for="fFolder">Add folder…</label>
    <label class="btn" for="fPics">Pictures…</label>
    <label class="btn" for="fNames">names.csv…</label>
  </div>
  <input id="fFiles" type="file" multiple>
  <input id="fFolder" type="file" webkitdirectory multiple>
  <input id="fPics" type="file" accept="image/*" multiple>
  <input id="fNames" type="file" accept=".csv,text/csv,text/plain">
  <input type="search" id="q" placeholder="Search figures">
  <div class="bar" style="margin-bottom:0">
    <select id="filter" style="flex:1"><option>All</option><option>Characters</option><option>Play sets</option><option>Discs</option><option>Not on base</option><option>On base</option></select>
    
  </div>
  <div class="list" id="list"></div>
  <label class="chk"><input type="checkbox" id="wb" checked> Keep game progress sent back by the Flipper</label>
  <p class="hint">Figures stay saved in this browser. Your 320-byte .bin dumps never leave your phone.</p>
</section>
<section><h2>Log</h2><div id="log"></div></section>
<dialog id="dlg"></dialog>
<script>
/* ===== CORE (no DOM): protocol, crypto, layout, figures, session, transports ===== */
const VERSION = 1, SOF = 0xA5, FIGURE_SIZE = 320, MAX_PAYLOAD = 1 + FIGURE_SIZE, SLOT_COUNT = 9;
const MSG = { HELLO: 1, LOAD: 2, REMOVE: 3, CLEAR: 4, STATUS_REQ: 5, STATUS: 0x81, RESULT: 0x82, SAVE: 0x83 };
const RESULT_TEXT = { 0: "ok", 1: "bad slot", 2: "bad length", 3: "nothing in that slot", 4: "unknown command" };
const USB_TEXT = { 0: "Flipper not plugged into a console", 1: "console starting...", 2: "console connected", 3: "console silent", 4: "console disconnected" };
const SERIAL_PROFILES = [
  { service: "8fe5b3d5-2e7f-4a98-2a48-7acc60fe0000", a: "19ed82ae-ed21-4c9d-4145-228e61fe0000", b: "19ed82ae-ed21-4c9d-4145-228e62fe0000" },
  { service: "6e400001-b5a3-f393-e0a9-e50e24dcca9e", a: "6e400002-b5a3-f393-e0a9-e50e24dcca9e", b: "6e400003-b5a3-f393-e0a9-e50e24dcca9e" },
];

function crc8(data, crc = 0) {
  for (const byte of data) {
    crc ^= byte;
    for (let i = 0; i < 8; i++) crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) & 0xFF : (crc << 1) & 0xFF;
  }
  return crc;
}
function encode(type, payload = new Uint8Array(0)) {
  if (payload.length > MAX_PAYLOAD) throw new Error("payload too large");
  const body = new Uint8Array(3 + payload.length);
  body[0] = type; body[1] = payload.length & 0xFF; body[2] = payload.length >> 8;
  body.set(payload, 3);
  const out = new Uint8Array(body.length + 2);
  out[0] = SOF; out.set(body, 1); out[out.length - 1] = crc8(body);
  return out;
}
class Parser {
  constructor() { this.buf = []; this.bad = 0; }
  feed(data) {
    for (const b of data) this.buf.push(b);
    const frames = [];
    for (;;) {
      const start = this.buf.indexOf(SOF);
      if (start < 0) { this.buf = []; break; }
      if (start) this.buf.splice(0, start);
      if (this.buf.length < 4) break;
      const length = this.buf[2] | (this.buf[3] << 8);
      if (length > MAX_PAYLOAD) { this.bad++; this.buf.shift(); continue; }
      const total = 5 + length;
      if (this.buf.length < total) break;
      const body = this.buf.slice(1, 4 + length);
      if (crc8(body) === this.buf[total - 1]) {
        frames.push({ type: body[0], payload: Uint8Array.from(body.slice(3)) });
        this.buf.splice(0, total);
      } else { this.bad++; this.buf.shift(); }
    }
    return frames;
  }
}

const P = {
  hello: () => encode(MSG.HELLO, Uint8Array.of(VERSION)),
  load(slot, fig) {
    if (fig.length !== FIGURE_SIZE) throw new Error("figure must be 320 bytes");
    const p = new Uint8Array(1 + FIGURE_SIZE); p[0] = slot; p.set(fig, 1); return encode(MSG.LOAD, p);
  },
  remove: (slot) => encode(MSG.REMOVE, Uint8Array.of(slot)),
  clear: () => encode(MSG.CLEAR),
  statusReq: () => encode(MSG.STATUS_REQ),
  parseStatus(p) {
    if (p.length < 4) throw new Error("short STATUS");
    const mask = p[2] | (p[3] << 8), present = new Set();
    for (let i = 0; i < 9; i++) if (mask & (1 << i)) present.add(i);
    return { version: p[0], usb: p[1], present };
  },
  parseResult(p) { if (p.length < 3) throw new Error("short RESULT"); return { request: p[0], slot: p[1], code: p[2] }; },
  parseSave(p) { if (p.length !== 1 + FIGURE_SIZE) throw new Error("bad SAVE length"); return [p[0], p.slice(1)]; },
};

/* ---- SHA-1 and AES-128 decrypt (sync, no dependencies) ---- */
function sha1(msg) {
  const rol = (x, n) => ((x << n) | (x >>> (32 - n))) >>> 0;
  const l = msg.length, padLen = ((l + 9 + 63) >> 6) << 6, b = new Uint8Array(padLen);
  b.set(msg); b[l] = 0x80;
  const dv = new DataView(b.buffer); dv.setUint32(padLen - 4, (l * 8) >>> 0); dv.setUint32(padLen - 8, Math.floor((l * 8) / 4294967296));
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const w = new Array(80);
  for (let o = 0; o < padLen; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 80; i++) w[i] = rol(w[i - 3] ^ w[i - 8] ^ w[i - 14] ^ w[i - 16], 1);
    let a = h0, bb = h1, c = h2, d = h3, e = h4;
    for (let i = 0; i < 80; i++) {
      let f, k;
      if (i < 20) { f = (bb & c) | (~bb & d); k = 0x5A827999; }
      else if (i < 40) { f = bb ^ c ^ d; k = 0x6ED9EBA1; }
      else if (i < 60) { f = (bb & c) | (bb & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = bb ^ c ^ d; k = 0xCA62C1D6; }
      const t = (rol(a, 5) + (f >>> 0) + e + k + w[i]) >>> 0;
      e = d; d = c; c = rol(bb, 30); bb = a; a = t;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + bb) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }

}
const [SBOX, INV_SBOX] = (() => {
  const s = new Array(256).fill(0); let p = 1, q = 1;

    p = p ^ ((p << 1) & 0xFF) ^ (p & 0x80 ? 0x1B : 0);
    q ^= q << 1; q ^= q << 2; q ^= q << 4; q &= 0xFF; if (q & 0x80) q ^= 0x09;
    let x = q ^ (((q << 1) | (q >> 7)) & 0xFF);
    x ^= ((q << 2) | (q >> 6)) & 0xFF; x ^= ((q << 3) | (q >> 5)) & 0xFF; x ^= ((q << 4) | (q >> 4)) & 0xFF;
    s[p] = (x ^ 0x63) & 0xFF;

const xtime = (x) => (x & 0x80 ? ((x << 1) ^ 0x1B) & 0xFF : x << 1);

    let t = w[i - 1].slice();

    s = s.map((v) => INV_SBOX[v]).map((v, i) => v ^ rks[rnd][i]);

      const u = s.slice();
      for (let c = 0; c < 4; c++) {
        const [a0, a1, a2, a3] = u.slice(c * 4, c * 4 + 4);

        s[c * 4 + 2] = gmul(a0, 13) ^ gmul(a1, 9) ^ gmul(a2, 14) ^ gmul(a3, 11);

const SHA1_CONST = Uint8Array.of(0xAF, 0x62, 0xD2, 0xEC, 0x04, 0x91, 0x96, 0x8C, 0xC5, 0x2A, 0x1A, 0x71, 0x65, 0xF8, 0x65, 0xFE, 0x28, 0x63, 0x29, 0x20, 0x44, 0x69, 0x73, 0x6E, 0x65, 0x79, 0x20, 0x32, 0x30, 0x31, 0x33);

  open() { return new Promise((res) => { try { const r = indexedDB.open("infportal", 1); r.onupgradeneeded = () => { r.result.createObjectStore("figs", { keyPath: "file" }); r.result.createObjectStore("pics", { keyPath: "name" }); }; r.onsuccess = () => { db = r.result; res(); }; r.onerror = () => res(); } catch (e) { res(); } }); },
  put(store, val) { if (!db) return; try { db.transaction(store, "readwrite").objectStore(store).put(val); } catch (e) {} },
  del(store, key) { if (!db) return; try { db.transaction(store, "readwrite").objectStore(store).delete(key); } catch (e) {} },
  all(store) { return new Promise((res) => { if (!db) return res([]); try { const r = db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => res([]); } catch (e) { res([]); } }); },
};
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function setMsg(text, bad = false) { const m = $("msg"); m.textContent = text; m.className = bad ? "r" : ""; }
function log(t) { const l = $("log"); l.textContent += (l.textContent ? "\n" : "") + new Date().toLocaleTimeString() + "  " + t; l.scrollTop = l.scrollHeight; }
function picFor(f) {
  if (picPick.has(f.number)) return picPick.get(f.number);
  for (const k of [norm(stem(f.file)), String(f.number), norm(figLabel(f))]) { const p = pics.get(k); if (k && p) return p.url; }
  return null;
}
const colourFor = (f) => PALETTE[f.number % PALETTE.length];
const initials = (n) => (n.match(/[A-Za-z0-9]+/g) || []).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
const sortFigs = () => figs.sort((a, b) => a.number - b.number || figLabel(a).localeCompare(figLabel(b)));

async function ingest(fileList) {
  let nb = 0, np = 0; const skipped = [];
  for (const file of fileList) {
    const name = file.name;
    if (IMAGE_RE.test(name)) {
      const k = norm(stem(name));
      if (k && !pics.has(k)) { pics.set(k, { name, url: URL.createObjectURL(file) }); idb.put("pics", { name, blob: file }); np++; }
    } else if (BIN_RE.test(name) || file.size === FIGURE_SIZE) {
      try {
        const fig = makeFigure(name, new Uint8Array(await file.arrayBuffer()));
        const old = figs.findIndex((f) => f.file === name); if (old >= 0) figs.splice(old, 1);
        figs.push(fig); idb.put("figs", { file: name, data: fig.data }); nb++;
      } catch (e) { skipped.push(e.message); }
    }
  }
  sortFigs();
  setMsg(`Added ${nb} figure${nb === 1 ? "" : "s"}` + (np ? `, ${np} picture${np === 1 ? "" : "s"}` : "") + (skipped.length ? `; skipped ${skipped.length} (${skipped[0]})` : ""), !nb && !np && skipped.length > 0);
  skipped.forEach(log); render(true);
}

/* ---- base drawing: slot 0 hex play set, 1-2 centre discs, 3-5 player 1, 6-8 player 2 ---- */
function geometry() {
  const tall = window.innerWidth < window.innerHeight * 0.9;
  if (!tall) return { w: 1000, h: 600, c: { 0: [500, 215, 118, "hex"], 1: [425, 440, 52], 2: [575, 440, 52], 3: [185, 255, 110], 4: [115, 455, 46], 5: [255, 455, 46], 6: [815, 255, 110], 7: [745, 455, 46], 8: [885, 455, 46] } };
  return { w: 600, h: 1000, c: { 0: [300, 140, 110, "hex"], 1: [190, 350, 58], 2: [410, 350, 58], 3: [160, 600, 100], 4: [350, 575, 52], 5: [500, 575, 52], 6: [160, 850, 100], 7: [350, 825, 52], 8: [500, 825, 52] } };
}
function hexPoints(cx, cy, r) { return [0, 1, 2, 3, 4, 5].map((i) => { const a = (Math.PI / 3) * i - Math.PI / 6; return `${cx + r * Math.cos(a)},${cy + r * Math.sin(a)}`; }).join(" "); }
function canTarget(slot) { return [...selected].some((f) => accepts(slot, f.category)); }
function draw() {
  const g = geometry(), svg = $("svg"), s = session;
  svg.setAttribute("viewBox", `0 0 ${g.w} ${g.h}`); svg.innerHTML = "";
  const el = (tag, attrs = {}, parent = svg) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  const defs = el("defs");
  for (let slot = 0; slot < SLOT_COUNT; slot++) {
    const [cx, cy, r, shape] = g.c[slot], fig = s.placed.get(slot), glow = GLOW[slot];
    const grp = el("g", { class: "slot" + (selected.size && !fig && canTarget(slot) ? " target" : "") });
    grp.addEventListener("click", () => slotTap(slot));
    const ring = (rr, attrs) => shape === "hex" ? el("polygon", { points: hexPoints(cx, cy, rr), ...attrs }, grp) : el("circle", { cx, cy, r: rr, ...attrs }, grp);
    ring(r + 10, { fill: "none", stroke: glow, "stroke-opacity": fig ? 0.55 : 0.18, "stroke-width": 8 });
    ring(r, { class: "ring" });
    if (fig) {
      const url = picFor(fig);
      if (url) {
        const cp = el("clipPath", { id: "cp" + slot }, defs);
        if (shape === "hex") el("polygon", { points: hexPoints(cx, cy, r - 4) }, cp); else el("circle", { cx, cy, r: r - 4 }, cp);
        el("image", { href: url, x: cx - r, y: cy - r, width: r * 2, height: r * 2, preserveAspectRatio: "xMidYMin slice", "clip-path": `url(#cp${slot})` }, grp);
      } else {
        ring(r - 4, { fill: colourFor(fig) });
        const t = el("text", { x: cx, y: cy, class: "ini" }, grp); t.textContent = initials(figLabel(fig));
      }
      const n = el("text", { x: cx, y: cy + r - 12, class: "nm" }, grp); n.textContent = figLabel(fig).slice(0, r > 90 ? 16 : 9);
      el("circle", { cx: cx + r * 0.72, cy: cy - r * 0.72, r: 13, fill: STATE_COLOR[s.state.get(slot)] || "#6b7385", stroke: "#0e1015", "stroke-width": 4 }, grp);
    }
    const lb = el("text", { x: cx, y: cy + r + 28, class: "sl" }, grp); lb.textContent = SLOT_NAMES[slot];
  }
}

/* ---- list ---- */
function visibleFigs() {
  const q = norm($("q").value), f = $("filter").value;
  const kind = { Characters: "character", "Play sets": "playset", Discs: "disc" }[f];
  return figs.filter((x) => (!q || norm(figLabel(x) + stem(x.file)).includes(q)) && (!kind || x.category === kind) &&
    (f !== "On base" || session.slotOf(x) !== null) && (f !== "Not on base" || session.slotOf(x) === null));
}
function renderList() {
  const list = $("list"); list.innerHTML = "";
  if (!figs.length) { list.innerHTML = '<p class="hint">No figures yet. Tap “Add figures…” and choose your 320-byte .bin files.</p>'; return; }
  for (const f of visibleFigs()) {
    const slot = session.slotOf(f), row = document.createElement("div");
    row.className = "row" + (selected.has(f) ? " sel" : "") + (slot !== null ? " onp" : "");
    const th = document.createElement("div"); th.className = "thumb"; const url = picFor(f);
    if (url) th.style.backgroundImage = `url("${url}")`; else { th.style.background = colourFor(f); th.textContent = initials(figLabel(f)); }
    const t = document.createElement("div"); t.className = "t"; t.innerHTML = "<div></div><small></small>";
    t.firstChild.textContent = figLabel(f);
    const tag = f.category === "disc" && isToyboxDisc(f.number) ? "Toy Box disc" : KIND_LABEL[f.category];
    t.lastChild.textContent = (slot !== null ? "on " + SLOT_NAMES[slot] : tag) + ` · ${f.file}`;
    const more = document.createElement("button"); more.className = "more"; more.textContent = "⋮";
    more.onclick = (e) => { e.stopPropagation(); figMenu(f); };
    row.append(th, t, more);
    row.onclick = () => {
      const now = Date.now();
      if (tap.f === f && now - tap.t < 400) { selected.clear(); tap.f = null; placeFigs([f], null); return; }
      tap.f = f; tap.t = now;
      if (selected.has(f)) selected.delete(f); else selected.add(f);
      render(true);
    };
    list.appendChild(row);
  }
}

/* ---- actions ---- */
function placeFigs(list, slot) {
  if (!list.length) return;
  let placed = 0; const notes = []; let first = slot;
  for (const f of list) {
    const [ok, msg] = session.place(f, first !== null && accepts(first, f.category) ? first : (first !== null && list.length === 1 ? first : null));
    if (ok) { placed++; if (first !== null && accepts(first, f.category)) first = null; } else notes.push(msg);
    if (list.length === 1) { setMsg(msg, !ok); selected.clear(); render(true); return; }
  }
  setMsg(`${placed} placed` + (notes.length ? "; " + notes.slice(0, 2).join("; ") + (notes.length > 2 ? ` (+${notes.length - 2} more)` : "") : ""), placed === 0);
  selected.clear(); render(true);
}
function slotTap(slot) {
  const fig = session.placed.get(slot);
  if (selected.size) { placeFigs([...selected], slot); return; }
  if (fig) { session.remove(slot); setMsg(`Lifted off ${SLOT_NAMES[slot]}`); render(true); }
}
function figMenu(f) {
  const d = $("dlg"); d.innerHTML = ""; const h = document.createElement("h3"); h.textContent = figLabel(f); d.appendChild(h);
  const add = (label, fn, cls) => { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = () => { d.close(); fn(); }; d.appendChild(b); };
  add("Place on next free slot", () => placeFigs([f], null));
  add("Set picture…", () => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.onchange = () => { if (i.files[0]) { picPick.set(f.number, URL.createObjectURL(i.files[0])); render(true); } }; i.click(); });
  if (picPick.has(f.number)) add("Clear picture I chose", () => { picPick.delete(f.number); render(true); });
  add("Rename (by figure number)…", () => { const n = prompt(`Name for figure ${f.number}`, figLabel(f)); if (n && n.trim()) { nameOverrides[f.number] = n.trim(); const o = lsGet("inf_names", {}); o[f.number] = n.trim(); lsSet("inf_names", o); render(true); } });
  add("Download dump" + (f.backup ? " (with game progress)" : ""), () => download(f.file, f.data));
  if (f.backup) add("Download original backup", () => download(f.file + ".bak", f.backup));
  add("Remove from library", () => { const s = session.slotOf(f); if (s !== null) session.remove(s); figs.splice(figs.indexOf(f), 1); selected.delete(f); idb.del("figs", f.file); render(true); }, "danger");
  add("Close", () => {});
  d.showModal();
}
function download(name, data) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/octet-stream" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }

function renderStatus() {
  const s = session, col = { connected: "g", connecting: "w" }[s.link] || "";
  $("status").innerHTML = `<div><b>Bluetooth:</b> <span class="${col}"></span></div><div><b>Console:</b> <span class="${(s.usb || 0) === 2 ? "g" : s.connected ? "w" : ""}"></span></div>`;
  const sp = $("status").querySelectorAll("span");
  sp[0].textContent = s.link + (s.connected && s.linkDetail ? ` (${s.linkDetail})` : "") + (demoFlip && s.transport === demoFlip ? " · DEMO" : "");
  sp[1].textContent = s.consoleText();
  $("bConnect").textContent = s.connected ? "Disconnect" : s.link === "connecting" ? "Connecting…" : "Connect";
  $("bConnect").className = s.connected ? "" : "primary";
}
function render(force) {
  const s = session;
  const sig = JSON.stringify([[...s.placed].map(([k, f]) => [k, f.file, s.state.get(k)]), s.connected, [...selected].map((f) => f.file), figs.length, $("q").value, $("filter").value, window.innerWidth < window.innerHeight * 0.9]);
  if (force || sig !== lastSig) { lastSig = sig; draw(); renderList(); }
  renderStatus();
}

function newSession(transport) {
  const s = new Session(transport, log, (fig) => { idb.put("figs", { file: fig.file, data: fig.data }); setMsg(`Saved game progress for ${figLabel(fig)}`); });
  s.writeBack = $("wb").checked; s.onChange = () => render(); return s;
}
function start() {
  session = newSession(new WebBleTransport());
  if (!WebBleTransport.supported()) setMsg("This browser can't do Bluetooth. Use Chrome on Android (iPhone: the Bluefy browser). Demo mode still works.", true);
  $("bConnect").onclick = () => { if (session.connected || session.link === "connecting") session.disconnect(); else session.connect(); };
  $("bDemo").onclick = () => {
    const keep = session.placed, old = session; demoFlip = new FakeFlipper();
    session = newSession(demoFlip); session.placed = keep; for (const k of keep.keys()) session.state.set(k, LOCAL);
    try { old.transport.disconnect(); } catch (e) {}
    session.connect(); setMsg("Demo mode: a simulated Flipper is connected."); render(true);
  };
  $("bPlaceSel").onclick = () => { const l = [...selected]; if (!l.length) return setMsg("Select one or more figures first.", true); placeFigs(l, null); };
  $("bPlaceAll").onclick = () => placeFigs(visibleFigs().filter((f) => session.slotOf(f) === null), null);
  $("bClear").onclick = () => { session.clear(); setMsg("Base cleared"); render(true); };
  $("wb").onchange = () => { session.writeBack = $("wb").checked; };
  $("q").oninput = () => render(true); $("filter").onchange = () => render(true);
  for (const id of ["fFiles", "fFolder", "fPics"]) $(id).onchange = (e) => { ingest([...e.target.files]); e.target.value = ""; };
  $("fNames").onchange = async (e) => { const f = e.target.files[0]; if (f) { const n = loadNamesCsv(await f.text()); const o = lsGet("inf_names", {}); Object.assign(o, nameOverrides); lsSet("inf_names", o); setMsg(`${n} names loaded`); render(true); } e.target.value = ""; };
  window.addEventListener("resize", () => render());
  setInterval(() => session.pollStatus(), 2000); setInterval(() => render(), 500); render(true);
}
(async () => {
  Object.assign(nameOverrides, lsGet("inf_names", {}));
  await idb.open();
  for (const r of await idb.all("figs")) { try { figs.push(makeFigure(r.file, new Uint8Array(r.data))); } catch (e) {} }
  for (const r of await idb.all("pics")) { const k = norm(stem(r.name)); if (k) pics.set(k, { name: r.name, url: URL.createObjectURL(r.blob) }); }
  sortFigs(); start();
})();
</script></body></html>
